<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#17152f">
  <meta name="description" content="Universo Estelar — explore uma praça mágica e crie sua própria aventura.">
  <title>Universo Estelar ✦</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="game">
    <div id="loading" class="loading">
      <div class="logo-star">✦</div>
      <h1>Universo Estelar</h1>
      <p>Preparando seu universo...</p>
      <div class="loading-track"><span></span></div>
    </div>
    <div class="topbar">
      <div class="brand"><span class="brand-icon">✦</span><span>UNIVERSO <b>ESTELAR</b></span></div>
      <div class="top-actions"><button id="cameraBtn" class="glass-button" aria-label="Alternar câmera">◉ Câmera</button><button id="soundBtn" class="glass-button" aria-label="Som">♫ Som</button></div>
    </div>
    <div class="welcome"><span class="eyebrow">SEU CANTINHO NO COSMOS</span><h2>Olá, estrelinha! <span>✧</span></h2><p>Explore a praça e descubra seu mundo.</p></div>
    <div class="hint" id="hint">Arraste o joystick para caminhar</div>
    <div class="joystick-zone" id="joystickZone" aria-label="Joystick virtual"><div class="joy-ring"><div id="joyKnob" class="joy-knob"></div></div></div>
    <div class="right-controls"><button id="interactBtn" class="action-button"><span>✧</span><small>INTERAGIR</small></button><button id="lookBtn" class="round-button" aria-label="Centralizar câmera">⟳</button></div>
    <div id="toast" class="toast" role="status"></div>
    <div class="bottom-label"><span class="live-dot"></span> PRAÇA DAS ESTRELAS <span class="label-separator">•</span> <span id="positionText">PRONTA PARA EXPLORAR</span></div>
    <div id="errorBox" class="error-box" hidden></div>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
